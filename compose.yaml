services:
  frontend:
    image: lavr-crm:${APP_MODE:-api}
    build:
      context: .
      args:
        VITE_DATA_MODE: ${APP_MODE:-api}
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"
    environment:
      API_PROXY_TARGET: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
  backend:
    image: lavr-crm-backend:local
    build:
      context: backend
    user: "1000:1000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lavr}:${POSTGRES_PASSWORD:?Run scripts/start.sh first}@postgres:5432/${POSTGRES_DB:-lavr}
      MEDIA_DIR: /data/media
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run scripts/start.sh first}
      SESSION_SECRET: ${SESSION_SECRET:?Run scripts/start.sh first}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_DEMO_CATALOG: ${SEED_DEMO_CATALOG:-true}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_NOTIFICATIONS_ENABLED: ${TELEGRAM_NOTIFICATIONS_ENABLED:-false}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
      TRUSTED_PROXY_HOSTS: ${TRUSTED_PROXY_HOSTS:-172.16.0.0/12}
    volumes:
      - media_data:/data/media
    depends_on:
      postgres:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
  notifications:
    image: lavr-crm-backend:local
    user: "1000:1000"
    command: ["python", "-m", "app.notification_worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lavr}:${POSTGRES_PASSWORD:?Run scripts/start.sh first}@postgres:5432/${POSTGRES_DB:-lavr}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_NOTIFICATIONS_ENABLED: ${TELEGRAM_NOTIFICATIONS_ENABLED:-false}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    healthcheck:
      disable: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lavr}
      POSTGRES_USER: ${POSTGRES_USER:-lavr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/start.sh first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
