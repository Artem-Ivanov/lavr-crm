services:
  frontend:
    image: lavr-crm:${APP_MODE:-demo}
    build:
      context: .
      args:
        VITE_DATA_MODE: ${APP_MODE:-demo}
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"
    environment:
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://host.docker.internal:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
