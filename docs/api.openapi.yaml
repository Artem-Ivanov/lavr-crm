            schema: { $ref: '#/components/schemas/SitePatch' }
      responses:
        '200':
          description: Настройки сохранены, версия увеличена
          headers:
            ETag: { $ref: '#/components/headers/ResourceETag' }
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteConfiguration' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/publications:
