                  items: { type: array, items: { $ref: '#/components/schemas/Publication' } }
                  total: { type: integer, minimum: 0 }
                  offset: { type: integer, minimum: 0 }
                  limit: { type: integer, minimum: 1, maximum: 100 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [AdminSite]
      operationId: createPublication
      summary: Создать акцию, объявление или горячее предложение, только admin
      description: >-
        Проверяются роль admin, Origin и CSRF. По умолчанию status=draft,
        startsAt/endsAt=null; version=1. Сервер проверяет существование готовых
        mediaId и целей. При публикации цели должны быть публично доступны;
        для товара это isActive=true AND category.isVisible=true.
        При двух непустых границах startsAt < endsAt; проверка выполняется также
