      summary: Поиск всей номенклатуры, включая скрытые категории, только admin
      description: >-
        Роль admin проверяется сервером. Поиск q по sku, учётному name, brand,
        внутреннему id и externalId без учёта регистра; фильтры объединяются AND.
        Скрытые категории и их товары остаются доступными в этом закрытом списке,
        чтобы новый сеанс CRM мог найти товар и открыть его presentation по id.
        Неактивные товары проекции также включаются. isVisible вычисляется как
        isActive=true AND category.isVisible=true. Сортировка name ASC,
        id ASC. Ответ не содержит путей файлов или учётных данных 1С.
      security: [{ ManagerCookie: [] }]
      x-required-roles: [admin]
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 120 }
        - name: category
          in: query
          schema: { $ref: '#/components/schemas/Category' }
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Номенклатура для таблицы CRM; пустой результат также имеет статус 200
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                required: [items, total, offset, limit]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AdminProductSummary' } }
                  total: { type: integer, minimum: 0 }
                  offset: { type: integer, minimum: 0 }
                  limit: { type: integer, minimum: 1, maximum: 100 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/products/{productId}/presentation:
    get:
      tags: [AdminCatalog]
      operationId: getProductPresentation
      summary: Товар и версия оформления, только admin
      description: >-
        Роль admin проверяется сервером; доступны неактивные товары проекции и
        товары скрытых категорий.
        Учётные поля product только для чтения; presentation — отдельные
        серверные данные витрины, которые импорт из 1С не перезаписывает.
      security: [{ ManagerCookie: [] }]
      x-required-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Учётная проекция и редактируемое оформление
          headers:
            ETag: { $ref: '#/components/headers/ResourceETag' }
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                required: [product, presentation]
                properties:
                  product: { $ref: '#/components/schemas/Product' }
                  presentation: { $ref: '#/components/schemas/ProductPresentation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [AdminCatalog]
      operationId: updateProductPresentation
      summary: Назначить категорию и оформление товара, только admin
      description: >-
        Проверяются роль admin, Origin, CSRF и If-Match версии presentation.
        Отсутствующие поля сохраняются; null удаляет текстовую замену; imageIds
        заменяется целиком, пустой список возвращает доверенное статическое
        изображение либо пустую строку. categoryId и готовые mediaId должны существовать.
        sku, учётное name, brand, externalId, priceKopecks и stock не принимаются
        и не отправляются в 1С. Создание номенклатуры ждёт отдельного контракта адаптера.
      security: [{ ManagerCookie: [] }]
      x-required-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductPresentationInput' }
      responses:
        '200':
          description: Оформление сохранено, версия увеличена
          headers:
            ETag: { $ref: '#/components/headers/ResourceETag' }
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductPresentation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/media:
    get:
      tags: [Media]
      operationId: listAdminMedia
      summary: Библиотека готовых медиа, только admin
      description: Роль admin проверяется сервером; сортировка createdAt DESC, id DESC
      security: [{ ManagerCookie: [] }]
      x-required-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Метаданные и закрытые пути предпросмотра
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                required: [items, total, offset, limit]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Media' } }
                  total: { type: integer, minimum: 0 }
                  offset: { type: integer, minimum: 0 }
                  limit: { type: integer, minimum: 1, maximum: 100 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Media]
      operationId: uploadMedia
      summary: Загрузить JPG, PNG или WebP до 5 MiB, только admin
      description: >-
        Проверяются роль admin, Origin и CSRF. Лимит файла 5242880 байт,
        ширина/высота не более 4096. Формат и размеры подтверждаются декодированием;
        SVG, неподдерживаемый/повреждённый файл — 415, превышение байтов — 413,
        размеров/некорректный alt — 422. Имя и Content-Type клиента не доверенные:
        сервер создаёт UUID-имя с проверенным расширением. Файл сохраняется на
        постоянный том; только после успеха метаданные в PostgreSQL получают
        state=ready. При неудаче записи метаданных файл убирается. Новый файл
        приватный до появления текущей публичной ссылки; статическая раздача
        дискового каталога uploads запрещена. Файл после загрузки неизменяемый.
      security: [{ ManagerCookie: [] }]
      x-required-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file, alt]
              properties:
                file:
                  type: string
                  format: binary
                  description: Декодируемое JPG/PNG/WebP, от 1 до 5242880 байт, до 4096×4096
                alt:
                  type: string
                  maxLength: 240
                  description: Текст изображения; пустая строка только для декоративного изображения
            encoding:
              file:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '201':
          description: Готовый файл и его метаданные
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Media' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /media/{mediaId}:
    get:
      tags: [Media]
      operationId: getPublicMediaFile
      summary: Файл только с текущей публичной ссылкой, без входа
      description: >-
        Каждый запрос проверяет готовность и ссылку из текущего публичного сайта,
        публикации в окне с доступной целью или товара с isActive=true AND
        category.isVisible=true. id сам по себе не даёт
        доступа: неопубликованный/архивный/скрытый файл без другой публичной ссылки
        возвращает 404. Проверка и no-store действуют также при прямом URL.
      parameters:
        - $ref: '#/components/parameters/MediaId'
      responses:
        '200': { $ref: '#/components/responses/MediaImage' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /admin/media/{mediaId}/file:
    get:
      tags: [Media]
      operationId: getAdminMediaFile
      summary: Закрытый предпросмотр готового файла, только admin
      description: Роль admin проверяется сервером, в том числе для неопубликованного медиа
      security: [{ ManagerCookie: [] }]
      x-required-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/MediaId'
      responses:
        '200': { $ref: '#/components/responses/MediaImage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    ManagerCookie:
      type: apiKey
      in: cookie
      name: lavr_session
      description: >-
        Серверная сессия сотрудника. Роль проверяется backend на каждом запросе;
        наличие вкладки CRM в frontend не даёт доступа. Cookie Path=/api;
        /admin/* и /manager/integration/* требуют admin, /manager/orders/* и /manager/feedback/* —
        manager/admin. Публичные запросы никогда не расширяют доступ по cookie.
  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    FeedbackId:
      name: feedbackId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id', pattern: '^[^\x00-\x1f\x7f]+$' }
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    PublicationId:
      name: publicationId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    MediaId:
      name: mediaId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        UUID одной логической операции. Область ключа: HTTP-метод, фактический
        путь с orderId и сотрудник для административных команд. Сетевой повтор
        сохраняет ключ и тело. Ключ оформления хранится до удаления заказа;
        ключи административного импорта/повтора — не менее 24 часов. Повтор
        другой задачи не возвращает задачу другого заказа. Неверный/отсутствующий ключ — 400.
        Публичный приём feedback и конверсия имеют независимые области ключей;
        ключ конверсии относится к обращению, а не сотруднику, и сохраняется с ним.
      schema: { type: string, format: uuid }
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Токен текущей серверной сессии; дополнительно проверяется Origin
      schema: { type: string, minLength: 32, maxLength: 256 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: >-
        ETag редактируемого ресурса либо его version в двойных кавычках.
        Отсутствующий/неверный формат — 400; устаревшая версия — 412.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
        examples: ['"3"']
  headers:
    ResourceETag:
      description: Текущая version ресурса в двойных кавычках для следующего If-Match
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
        examples: ['"3"']
    OrderETag:
      description: Версия заказа в двойных кавычках для следующего If-Match
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
        examples: ['"3"']
  schemas:
    Id:
      type: string
      minLength: 1
      maxLength: 128
      description: Стабильный непрозрачный идентификатор, не артикул/номер заказа
    MoneyKopecks:
      type: integer
      minimum: 0
      maximum: 9007199254740991
      description: Целые копейки RUB в безопасном диапазоне целых JavaScript
    Category:
      $ref: '#/components/schemas/Id'
      description: Идентификатор категории витрины, которой управляет CRM
      examples: [filters]
    Product:
      type: object
      additionalProperties: false
      required: [id, externalId, sku, brand, name, category, priceKopecks, stock, image, deliveryDays]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        externalId:
          type: string
          readOnly: true
          minLength: 1
          maxLength: 128
          description: Стабильная внешняя ссылка, а не учётные данные или URL 1С
        sku: { type: string, minLength: 1, maxLength: 80, readOnly: true }
        brand: { type: string, minLength: 1, maxLength: 80, readOnly: true }
        name:
          type: string
          minLength: 1
          maxLength: 240
          readOnly: true
          description: Учётное имя из 1С; для витрины websiteTitle может его заменить
        category:
          $ref: '#/components/schemas/Category'
          description: Идентификатор категории из серверного оформления товара
        priceKopecks:
          $ref: '#/components/schemas/MoneyKopecks'
          readOnly: true
        stock:
          type: integer
          readOnly: true
          minimum: 0
          maximum: 2147483647
          description: Доступность проекции с учётом ещё не учтённых в 1С локальных резервов
        image:
          type: string
          format: uri-reference
          pattern: '^(|/api/media/[A-Za-z0-9_-]+|/images/(hero-car|motor-oil|oil-filter|brake-disc|spark-plug|air-filter)\.jpg)$'
          description: >-
            Первый текущий PublicMedia.path из images, один из шести доверенных
            статических файлов или пустая строка для товара без фото. Серверный
            mapper игнорирует произвольные пути/URL изображения из 1С, проверяет
            текущую публичную ссылку медиа и не скачивает внешние изображения.
            Закрытый предпросмотр использует /admin/media/{mediaId}/file.
        websiteTitle: { type: [string, 'null'], minLength: 1, maxLength: 240 }
        websiteDescription: { type: [string, 'null'], maxLength: 4000 }
        images:
          type: array
          maxItems: 8
          items: { $ref: '#/components/schemas/PublicMedia' }
        deliveryDays:
          type: integer
          minimum: 0
          maximum: 365
          description: Ориентир срока; итоговые условия подтверждает менеджер
    CatalogPage:
      type: object
      additionalProperties: false
      required: [items, total, offset, limit, catalogUpdatedAt, stale]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Product' }
        total: { type: integer, minimum: 0 }
        offset: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        catalogUpdatedAt: { type: string, format: date-time }
        stale: { type: boolean }
    InternalTarget:
      description: >-
        Внутренняя цель; backend проверяет существование и публичную доступность.
        Для категории нужна isVisible=true, для товара — isActive=true AND
        category.isVisible=true. Каталог и фиксированные разделы доступны публично.
      oneOf:
        - type: object
          additionalProperties: false
          required: [type]
          properties:
            type: { const: catalog }
        - type: object
          additionalProperties: false
          required: [type, categoryId]
          properties:
            type: { const: category }
            categoryId: { $ref: '#/components/schemas/Id' }
        - type: object
          additionalProperties: false
          required: [type, productId]
          properties:
            type: { const: product }
            productId: { $ref: '#/components/schemas/Id' }
        - type: object
          additionalProperties: false
          required: [type, section]
          properties:
            type: { const: section }
            section: { type: string, enum: [offers, announcements, hot] }
    MenuItem:
      type: object
      additionalProperties: false
      required: [label, target, position, isVisible]
      properties:
        label: { type: string, minLength: 1, maxLength: 80 }
        target: { $ref: '#/components/schemas/InternalTarget' }
        position: { type: integer, minimum: 0, maximum: 1000000 }
        isVisible: { type: boolean }
    SiteSettings:
      type: object
      additionalProperties: false
      required: [storeName, phone, address, hours, categoriesTitle, promotionsTitle, catalogTitle]
      description: Публичные реквизиты и заголовки фиксированных разделов; все поля — обычный текст, не HTML
      properties:
        storeName: { type: string, minLength: 1, maxLength: 120 }
        phone: { type: string, minLength: 10, maxLength: 30 }
        address: { type: string, minLength: 1, maxLength: 500 }
        hours: { type: string, minLength: 1, maxLength: 240 }
        categoriesTitle: { type: string, minLength: 1, maxLength: 120, examples: ['Что нужно вашему авто?'] }
        promotionsTitle: { type: string, minLength: 1, maxLength: 120, examples: ['Акции и объявления'] }
        catalogTitle: { type: string, minLength: 1, maxLength: 120, examples: ['Каталог автозапчастей'] }
    SiteHero:
      type: object
      additionalProperties: false
      required: [title, description, imageId, buttonText, target]
      properties:
        title: { type: string, minLength: 1, maxLength: 240 }
        description: { type: string, maxLength: 2000 }
        imageId:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
          description: Готовое медиа; null убирает только фоновое изображение, сохраняя тексты и CTA
        buttonText: { type: string, minLength: 1, maxLength: 80 }
        target: { $ref: '#/components/schemas/InternalTarget' }
    SitePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        hero: { $ref: '#/components/schemas/SiteHero' }
        settings: { $ref: '#/components/schemas/SiteSettings' }
        menu:
          type: array
          maxItems: 12
          items: { $ref: '#/components/schemas/MenuItem' }
          description: Порядок position ASC; при равенстве сохраняется порядок элементов списка
    SiteConfiguration:
      type: object
      additionalProperties: false
      required: [hero, settings, menu, version]
      properties:
        hero: { $ref: '#/components/schemas/SiteHero' }
        settings: { $ref: '#/components/schemas/SiteSettings' }
        menu: { type: array, maxItems: 12, items: { $ref: '#/components/schemas/MenuItem' } }
        version: { type: integer, minimum: 1 }
    PublicSite:
      type: object
      additionalProperties: false
      required: [hero, settings, menu, publications]
      properties:
        hero:
          type: object
          additionalProperties: false
          required: [title, description, image, buttonText, target]
          properties:
            title: { type: string, minLength: 1, maxLength: 240 }
            description: { type: string, maxLength: 2000 }
            buttonText: { type: string, minLength: 1, maxLength: 80 }
            target:
              oneOf:
                - $ref: '#/components/schemas/InternalTarget'
                - type: 'null'
              description: null скрывает CTA, если внутренняя цель стала недоступна
            image:
              oneOf:
                - $ref: '#/components/schemas/PublicMedia'
                - type: 'null'
        settings: { $ref: '#/components/schemas/SiteSettings' }
        menu:
          type: array
          maxItems: 12
          items:
            allOf:
              - $ref: '#/components/schemas/MenuItem'
              - properties:
                  isVisible: { const: true }
        publications:
          type: array
          items: { $ref: '#/components/schemas/PublicPublication' }
    PublicationInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        kind: { type: string, enum: [offer, announcement, hot] }
        title: { type: string, minLength: 1, maxLength: 240 }
        description: { type: string, maxLength: 4000 }
        imageIds:
          type: array
          maxItems: 8
          uniqueItems: true
          items: { $ref: '#/components/schemas/Id' }
        target: { $ref: '#/components/schemas/InternalTarget' }
        buttonText: { type: string, minLength: 1, maxLength: 80 }
        position: { type: integer, minimum: 0, maximum: 1000000 }
        status: { type: string, enum: [draft, published, archived], default: draft }
        startsAt: { type: [string, 'null'], format: date-time }
        endsAt: { type: [string, 'null'], format: date-time }
    Publication:
      type: object
      additionalProperties: false
      required: [id, kind, title, description, imageIds, target, buttonText, position, status, startsAt, endsAt, version]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        kind: { type: string, enum: [offer, announcement, hot] }
        title: { type: string, minLength: 1, maxLength: 240 }
        description: { type: string, maxLength: 4000 }
        imageIds: { type: array, maxItems: 8, uniqueItems: true, items: { $ref: '#/components/schemas/Id' } }
        target: { $ref: '#/components/schemas/InternalTarget' }
        buttonText: { type: string, minLength: 1, maxLength: 80 }
        position: { type: integer, minimum: 0, maximum: 1000000 }
        status: { type: string, enum: [draft, published, archived] }
        startsAt: { type: [string, 'null'], format: date-time }
        endsAt: { type: [string, 'null'], format: date-time }
        version: { type: integer, minimum: 1 }
    PublicPublication:
      type: object
      additionalProperties: false
      required: [id, kind, title, description, images, target, buttonText, position]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        kind: { type: string, enum: [offer, announcement, hot] }
        title: { type: string, minLength: 1, maxLength: 240 }
        description: { type: string, maxLength: 4000 }
        images: { type: array, maxItems: 8, items: { $ref: '#/components/schemas/PublicMedia' } }
        target: { $ref: '#/components/schemas/InternalTarget' }
        buttonText: { type: string, minLength: 1, maxLength: 80 }
        position: { type: integer, minimum: 0, maximum: 1000000 }
    CategoryInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        position: { type: integer, minimum: 0, maximum: 1000000 }
        isVisible: { type: boolean }
        showInMenu: { type: boolean }
    CatalogCategory:
      type: object
      additionalProperties: false
      required: [id, name, position, isVisible, showInMenu, version]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string, minLength: 1, maxLength: 80 }
        position: { type: integer, minimum: 0, maximum: 1000000 }
        isVisible: { type: boolean }
        showInMenu: { type: boolean }
        version: { type: integer, minimum: 1 }
    PublicCategory:
      type: object
      additionalProperties: false
      required: [id, name, position, showInMenu]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string, minLength: 1, maxLength: 80 }
        position: { type: integer, minimum: 0, maximum: 1000000 }
        showInMenu: { type: boolean }
    AdminProductSummary:
      type: object
      additionalProperties: false
      required: [id, sku, brand, name, category, priceKopecks, stock, isVisible]
      description: Учётные поля только для чтения; оформление меняется через отдельный presentation endpoint
      properties:
        id: { $ref: '#/components/schemas/Id' }
        sku: { type: string, minLength: 1, maxLength: 80, readOnly: true }
        brand: { type: string, minLength: 1, maxLength: 80, readOnly: true }
        name: { type: string, minLength: 1, maxLength: 240, readOnly: true }
        category: { $ref: '#/components/schemas/Category' }
        priceKopecks: { $ref: '#/components/schemas/MoneyKopecks', readOnly: true }
        stock: { type: integer, minimum: 0, maximum: 2147483647, readOnly: true }
        isVisible:
          type: boolean
          readOnly: true
          description: Текущая видимость товара, вычисленная как isActive=true AND category.isVisible=true
    ProductPresentationInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        categoryId: { $ref: '#/components/schemas/Id' }
        websiteTitle: { type: [string, 'null'], minLength: 1, maxLength: 240 }
        websiteDescription: { type: [string, 'null'], maxLength: 4000 }
        imageIds:
          type: array
          maxItems: 8
          uniqueItems: true
          items: { $ref: '#/components/schemas/Id' }
    ProductPresentation:
      type: object
      additionalProperties: false
      required: [productId, categoryId, websiteTitle, websiteDescription, imageIds, version]
      properties:
        productId: { $ref: '#/components/schemas/Id' }
        categoryId: { $ref: '#/components/schemas/Id' }
        websiteTitle: { type: [string, 'null'], minLength: 1, maxLength: 240 }
        websiteDescription: { type: [string, 'null'], maxLength: 4000 }
        imageIds: { type: array, maxItems: 8, uniqueItems: true, items: { $ref: '#/components/schemas/Id' } }
        version: { type: integer, minimum: 1 }
    PublicMedia:
      type: object
      additionalProperties: false
      required: [id, path, alt, width, height]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        path:
          type: string
          pattern: '^/api/media/[A-Za-z0-9_-]+$'
          description: Только маршрут с серверной проверкой текущей публичной ссылки
        alt: { type: string, maxLength: 240 }
        width: { type: integer, minimum: 1, maximum: 4096 }
        height: { type: integer, minimum: 1, maximum: 4096 }
    Media:
      type: object
      additionalProperties: false
      required: [id, path, alt, width, height, mimeType, sizeBytes, state, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        path:
          type: string
          pattern: '^/api/admin/media/[A-Za-z0-9_-]+/file$'
          description: Закрытый путь предпросмотра; путь файла на дисковом томе не раскрывается
        alt: { type: string, maxLength: 240 }
        width: { type: integer, minimum: 1, maximum: 4096 }
        height: { type: integer, minimum: 1, maximum: 4096 }
        mimeType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        sizeBytes: { type: integer, minimum: 1, maximum: 5242880 }
        state: { type: string, const: ready }
        createdAt: { type: string, format: date-time }
    CartItem:
      type: object
      additionalProperties: false
      required: [productId, quantity]
      description: Локальная корзина; хранение цены здесь не требуется
      properties:
        productId: { $ref: '#/components/schemas/Id' }
        quantity: { type: integer, minimum: 1, maximum: 999 }
    OrderItemInput:
      type: object
      additionalProperties: false
      required: [productId, quantity, expectedUnitPriceKopecks]
      properties:
        productId: { $ref: '#/components/schemas/Id' }
        quantity: { type: integer, minimum: 1, maximum: 999 }
        expectedUnitPriceKopecks:
          $ref: '#/components/schemas/MoneyKopecks'
          description: Показанная клиенту цена для обнаружения конфликта, не источник расчёта
    FeedbackType:
      type: string
      enum: [contact, request]
      description: contact — свяжитесь со мной; request — оставить запрос с обязательным текстом
    FeedbackStatus:
      type: string
      enum: [new, in_progress, converted, closed]
      description: converted и closed терминальны; converted устанавливается только созданием заказа
    FeedbackContactMethod:
      type: string
      enum: ['', phone, email, messenger]
      default: ''
      description: Необязательный канал связи в заметке; пустая строка — не указан
    FeedbackMessenger:
      type: object
      additionalProperties: false
      description: >-
        Сервис и контакт обрезаются по краям; нужны оба непустых значения либо
        оба пустых. Контрольные символы запрещены. Контакт — обычный текст;
        существование аккаунта и владение им не подтверждаются.
      properties:
        service: { type: string, maxLength: 40, default: '', pattern: '^[^\x00-\x1f\x7f-\x9f]*$' }
        address: { type: string, maxLength: 254, default: '', pattern: '^[^\x00-\x1f\x7f-\x9f]*$' }
      oneOf:
        - properties:
            service: { const: '' }
            address: { const: '' }
        - required: [service, address]
          properties:
            service: { minLength: 1 }
            address: { minLength: 1 }
    CreateFeedbackRequest:
      type: object
      additionalProperties: false
      required: [type]
      description: >-
        Значения строк обрезаются по краям; хотя бы один контакт обязателен после
        нормализации. Проверяется каждый заполненный контакт. Имя и контакты
        однострочные, контрольные символы U+0000–001F и U+007F–009F запрещены;
        в message допустимы CR/LF. Лишние поля, роли, статусы, сотрудники и null
        не принимаются. Для request нужен непустой message. Браузер не сохраняет
        тело формы или контакты в localStorage/sessionStorage; допустимы только
        UUID и SHA-256 отпечаток попытки в отдельном техническом ключе.
      properties:
        type: { $ref: '#/components/schemas/FeedbackType' }
        name: { type: string, maxLength: 100, default: '', pattern: '^[^\x00-\x1f\x7f-\x9f]*$' }
        phone:
          type: string
          maxLength: 30
          default: ''
          pattern: '^[^\x00-\x1f\x7f-\x9f]*$'
          description: >-
            Пустая строка либо российский номер: +7/7/8 и 10 цифр;
            пробелы, скобки и дефисы удаляются. Результат — +7XXXXXXXXXX.
        email:
          type: string
          maxLength: 254
          default: ''
          description: Пустая строка либо адрес вида user@host.tld без пробелов, ?, # и контрольных символов
        messenger:
          $ref: '#/components/schemas/FeedbackMessenger'
          default: { service: '', address: '' }
        message: { type: string, maxLength: 2000, default: '', pattern: '^[^\x00-\x09\x0b\x0c\x0e-\x1f\x7f-\x9f]*$' }
      anyOf:
        - required: [phone]
          properties:
            phone: { minLength: 1 }
        - required: [email]
          properties:
            email: { minLength: 1 }
        - required: [messenger]
          properties:
            messenger:
              required: [address]
              properties:
                address: { minLength: 1 }
      allOf:
        - if:
            properties:
              type: { const: request }
            required: [type]
          then:
            required: [message]
            properties:
              message: { minLength: 1 }
    FeedbackReceipt:
      type: object
      additionalProperties: false
      required: [id, number, createdAt, state]
      description: Неизменяемая публичная квитанция без контактов, приватного статуса и связи с заказом
      properties:
        id: { $ref: '#/components/schemas/Id' }
        number: { type: string, minLength: 1, maxLength: 80 }
        createdAt: { type: string, format: date-time }
        state: { type: string, const: accepted }
    ChangeFeedbackStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [in_progress, closed] }
        resolution:
          type: string
          maxLength: 2000
          default: ''
          pattern: '^[^\x00-\x09\x0b\x0c\x0e-\x1f\x7f-\x9f]*$'
          description: Текст обрезается по краям; для closed обязателен непустой результат, для in_progress — пустой
      allOf:
        - if:
            properties:
              status: { const: closed }
            required: [status]
          then:
            required: [resolution]
            properties:
              resolution: { minLength: 1 }
          else:
            properties:
              resolution: { const: '' }
    AddFeedbackNoteRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: '^[^\x00-\x09\x0b\x0c\x0e-\x1f\x7f-\x9f]*$'
          description: Непустой после trim текст; CR/LF допустимы, прочие контрольные символы запрещены
        contactMethod: { $ref: '#/components/schemas/FeedbackContactMethod' }
    FeedbackStaff:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string, maxLength: 240 }
    FeedbackHistoryEntry:
      type: object
      additionalProperties: false
      required: [id, createdAt, staff, action, text, contactMethod]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        createdAt: { type: string, format: date-time }
        staff:
          anyOf:
            - $ref: '#/components/schemas/FeedbackStaff'
            - type: 'null'
        action:
          type: string
          enum: [feedback.created, feedback.claimed, feedback.closed, feedback.converted, feedback.note_added]
        text: { type: string, maxLength: 2000 }
        contactMethod: { $ref: '#/components/schemas/FeedbackContactMethod' }
    FeedbackNotification:
      type: object
      additionalProperties: false
      required: [state, code]
      description: Безопасное состояние Telegram без токена, контактов и необработанного ответа провайдера
      properties:
        state:
          type: string
          enum: [not_configured, queued, running, done, error, uncertain]
          description: not_configured — ждёт настройки; done — отправлено; uncertain допускает повтор уведомления
        code: { type: [string, 'null'], pattern: '^[A-Z][A-Z0-9_]{0,79}$' }
    ManagerFeedback:
      type: object
      additionalProperties: false
      required: [id, number, createdAt, updatedAt, type, name, phone, email, messenger, message, status, assignedTo, version, resolution, order, history, notification]
      description: >-
        Полная закрытая карточка. Исходные контакты/запрос сохраняются независимо
        от реквизитов созданного заказа. assignedTo=null до взятия в работу;
        при in_progress ответственный обязателен. order заполнен только при
        converted и содержит квитанцию заказа. История объединяет создание,
        аудит статусов/конверсии и заметки, сортируется createdAt ASC, id ASC;
        staff=null только для публичного создания.
      properties:
        id: { $ref: '#/components/schemas/Id' }
        number: { type: string, minLength: 1, maxLength: 80 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        type: { $ref: '#/components/schemas/FeedbackType' }
        name: { type: string, maxLength: 100 }
        phone: { type: string, pattern: '^(\+7[0-9]{10})?$' }
        email: { type: string, maxLength: 254 }
        messenger:
          $ref: '#/components/schemas/FeedbackMessenger'
          required: [service, address]
        message: { type: string, maxLength: 2000 }
        status: { $ref: '#/components/schemas/FeedbackStatus' }
        assignedTo:
          anyOf:
            - $ref: '#/components/schemas/FeedbackStaff'
            - type: 'null'
        version: { type: integer, minimum: 1, maximum: 9007199254740991 }
        resolution: { type: string, maxLength: 2000 }
        order:
          anyOf:
            - $ref: '#/components/schemas/OrderReceipt'
            - type: 'null'
        history:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/FeedbackHistoryEntry' }
        notification: { $ref: '#/components/schemas/FeedbackNotification' }
    FeedbackPage:
      type: object
      additionalProperties: false
      required: [items, total, offset, limit]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ManagerFeedback' }
        total: { type: integer, minimum: 0 }
        offset: { type: integer, minimum: 0, maximum: 9007199254740991 }
        limit: { type: integer, minimum: 1, maximum: 100 }
    Customer:
      type: object
      additionalProperties: false
      required: [name, phone]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        phone:
          type: string
          minLength: 10
          maxLength: 30
          description: >-
            Backend нормализует номер и проверяет допустимый телефон после удаления
            пробелов/скобок/дефисов; не принимает произвольный текст.
        email:
          type: string
          maxLength: 254
          anyOf:
            - format: email
            - const: ''
          description: Необязательный email; пустая строка означает отсутствие email
    Fulfillment:
      type: object
      additionalProperties: false
      required: [method]
      properties:
        method: { type: string, enum: [pickup, delivery] }
        address: { type: string, maxLength: 500 }
      allOf:
        - if:
            properties:
              method: { const: delivery }
            required: [method]
          then:
            required: [address]
            properties:
              address: { minLength: 1 }
      description: >-
        Для доставки требуется непустой адрес после trim. Сумма заказа не
        включает доставку; стоимость и сроки уточняет менеджер.
    CreateOrderRequest:
      type: object
      additionalProperties: false
      required: [customer, fulfillment, items]
      properties:
        customer: { $ref: '#/components/schemas/Customer' }
        fulfillment: { $ref: '#/components/schemas/Fulfillment' }
        items:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/OrderItemInput' }
          description: Повторяющиеся productId отвергаются с 422; дробные количества запрещены
    OrderStatus:
      type: string
      enum: [new, confirmed, ready, completed, cancelled]
    IntegrationStatus:
      type: string
      enum: [not_connected, pending_sync, exporting, exported, error, cancelled_before_sync]
      description: >-
        not_connected — демо/ненастроенное соединение; pending_sync — локально
        принятая заявка; exporting — отправка/сверка; exported — подтверждены
        документ и резерв 1С; error — проблема обмена; cancelled_before_sync —
        безопасная отмена без документа 1С. Бизнес-статус хранится отдельно.
    OrderItem:
      type: object
      required: [productId, sku, brand, name, quantity, unitPriceKopecks]
      description: Неизменяемый снимок на момент создания заказа
      properties:
        productId: { $ref: '#/components/schemas/Id' }
        sku: { type: string }
        brand: { type: string }
        name: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 999 }
        unitPriceKopecks: { $ref: '#/components/schemas/MoneyKopecks' }
    Order:
      type: object
      description: >-
        Общая модель демо/будущей CRM; публичное оформление возвращает только
        OrderReceipt. Демо использует integrationStatus=not_connected.
      required: [id, number, createdAt, customer, fulfillment, items, totalKopecks, status, integrationStatus]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        number: { type: string, minLength: 1, maxLength: 80 }
        createdAt: { type: string, format: date-time }
        customer: { $ref: '#/components/schemas/Customer' }
        fulfillment: { $ref: '#/components/schemas/Fulfillment' }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OrderItem' }
        totalKopecks: { $ref: '#/components/schemas/MoneyKopecks' }
        status: { $ref: '#/components/schemas/OrderStatus' }
        integrationStatus: { $ref: '#/components/schemas/IntegrationStatus' }
    OrderReceipt:
      type: object
      additionalProperties: false
      required: [id, number, createdAt, totalKopecks, status, integrationStatus]
      description: Без контактов покупателя; это квитанция, не endpoint чтения истории заказа
      properties:
        id: { $ref: '#/components/schemas/Id' }
        number: { type: string }
        createdAt: { type: string, format: date-time }
        totalKopecks: { $ref: '#/components/schemas/MoneyKopecks' }
        status: { $ref: '#/components/schemas/OrderStatus' }
        integrationStatus: { $ref: '#/components/schemas/IntegrationStatus' }
    ManagerOrder:
      allOf:
        - $ref: '#/components/schemas/Order'
        - type: object
          required: [version, canCancel, externalDocumentId]
          properties:
            version: { type: integer, minimum: 1 }
            canCancel:
              type: boolean
              description: Вычисляется сервером с учётом состояния worker и определённости результата 1С
            externalDocumentId:
              type: [string, 'null']
              description: Полученная ссылка документа 1С; null до подтверждения экспорта
    ManagerSession:
      type: object
      required: [user, csrfToken, expiresAt]
      properties:
        user:
          type: object
          required: [id, name, role]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            name: { type: string }
            role: { type: string, enum: [manager, admin] }
        csrfToken: { type: string, minLength: 32, maxLength: 256 }
        expiresAt: { type: string, format: date-time }
    SyncHealth:
      type: object
      required: [state, catalogUpdatedAt, lastOrderExportAt, catalogStale, pendingCount, errorCount]
      properties:
        state: { type: string, enum: [not_connected, healthy, degraded, offline] }
        catalogUpdatedAt: { type: [string, 'null'], format: date-time }
        lastOrderExportAt: { type: [string, 'null'], format: date-time }
        catalogStale: { type: boolean }
        pendingCount: { type: integer, minimum: 0 }
        errorCount: { type: integer, minimum: 0 }
        lastErrorCode:
          type: [string, 'null']
          description: Безопасный внутренний код без тела/URL/учётных данных 1С
    SyncJob:
      type: object
      required: [jobId, state]
      properties:
        jobId: { $ref: '#/components/schemas/Id' }
        state: { type: string, enum: [queued, running] }
    Error:
      type: object
      additionalProperties: false
      required: [code, message, requestId]
      properties:
        code:
          type: string
          description: >-
            Например PRICE_CHANGED, OUT_OF_STOCK, PRODUCT_UNAVAILABLE,
            IDEMPOTENCY_CONFLICT, IDEMPOTENCY_IN_PROGRESS, INVALID_TRANSITION,
            CANCEL_NOT_ALLOWED, VERSION_CONFLICT, CATALOG_STALE, VALIDATION_ERROR.
        message: { type: string, description: Безопасное сообщение для пользователя }
        requestId: { type: string, description: Идентификатор для обращения в поддержку }
        details:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              field: { type: string }
              productId: { $ref: '#/components/schemas/Id' }
              orderId: { $ref: '#/components/schemas/Id', description: Уже созданный заказ при FEEDBACK_ALREADY_CONVERTED }
              code: { type: string }
              currentPriceKopecks: { $ref: '#/components/schemas/MoneyKopecks' }
              availableStock: { type: integer, minimum: 0 }
  responses:
    BadRequest:
      description: Некорректный JSON, обязательный заголовок отсутствует/имеет неверный формат
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Нет действующей сессии или неверные данные входа
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Недостаточная роль, запрещённый Origin или неверный CSRF-токен
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Объект не найден или товар скрыт из публичного каталога
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Конфликт цены, наличия, состояния заказа, ключа идемпотентности или имени категории
      headers:
        Retry-After:
          description: Секунды до повтора только при IDEMPOTENCY_IN_PROGRESS
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Валидный JSON/параметры, но значения, неизвестные поля или ссылки недопустимы
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    VersionConflict:
      description: VERSION_CONFLICT — ресурс изменился; нужно перечитать объект и повторить осознанное изменение
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PayloadTooLarge:
      description: Файл больше 5242880 байт; медиа не создано
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnsupportedMediaType:
      description: Поддерживаются только успешно декодируемые JPG, PNG и WebP; медиа не создано
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    MediaImage:
      description: Проверенное готовое изображение; доступ проверяется сервером для каждого запроса
      headers:
        Cache-Control: { schema: { type: string, const: no-store } }
        X-Content-Type-Options: { schema: { type: string, const: nosniff } }
      content:
        image/jpeg:
          schema: { type: string, format: binary }
        image/png:
          schema: { type: string, format: binary }
        image/webp:
          schema: { type: string, format: binary }
    RateLimited:
      description: Слишком много запросов
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unavailable:
      description: >-
        Каталог ещё не загружен/устарел для оформления либо backend временно
        недоступен. Клиент повторяет запрос с исходным ключом: ошибка или
        сетевой сбой сами по себе не доказывают отсутствие сохранённого заказа.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
