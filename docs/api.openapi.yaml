    patch:
      tags: [AdminSite]
      operationId: updateSite
      summary: Изменить тексты, баннер и меню, только admin
      description: >-
        Проверяются роль admin, Origin, CSRF и If-Match. Отсутствующие секции
        сохраняются; переданная hero/settings/menu заменяется целиком. Изменение
        сразу обновляет публичную проекцию. Сервер проверяет ссылки на готовые
        медиа и внутренние цели; конструктор HTML-страниц отсутствует.
