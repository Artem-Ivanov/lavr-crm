openapi: 3.1.0
info:
  title: LAVR Storefront and CRM API
  version: 0.1.0-design
  description: >-
    Проектируемый контракт рабочего backend. Статическое демо не реализует эти
    маршруты, серверную авторизацию или интеграцию с 1С. Все деньги — целые копейки
    RUB; сумма заказа включает только товары. Оплата в MVP отсутствует.
    Vue — тонкий клиент FastAPI: данные сайта, категории, публикации и метаданные
    медиа хранятся в PostgreSQL, файлы — на постоянном дисковом томе вне dist и
    эфемерного слоя контейнера. Формы и API-кеши браузера временные; локальная
    корзина может хранить только productId/quantity. Публичный режим не требует
    входа. Manager работает с заказами и обращениями; admin также управляет сайтом, каталогом,
    медиа и интеграцией. Роль проверяется сервером для каждого запроса.
    Все PATCH проверяют текущую version атомарно через If-Match; 412 требует
    перечитать объект. POST создания объекта задаёт version=1, если версия у него
    предусмотрена. POST заметки и конверсии обращения проверяют If-Match и увеличивают
    версию существующего обращения. Закрытые ответы — no-store.
    Товар публично доступен только при isActive=true в учётной проекции
    (не удалён и не помечен к удалению в 1С) AND category.isVisible=true.
    isActive — внутреннее поле импорта, а не редактируемое поле сайта.
    Один предикат действует для каталога, оформления, меню, CTA и публичных медиа.
servers:
  - url: /api
    description: Будущий API на том же origin, что и витрина
security: []
tags:
  - name: Catalog
  - name: Orders
  - name: Feedback
  - name: ManagerSession
  - name: ManagerOrders
  - name: ManagerFeedback
  - name: Integration
  - name: Site
  - name: AdminSite
  - name: AdminCatalog
  - name: Media
paths:
  /catalog:
    get:
      tags: [Catalog]
      operationId: listProducts
      summary: Публичный каталог без данных покупателей
      description: >-
        Поиск по name, sku и brand без учёта регистра. Фильтры объединяются AND.
        inStock=true оставляет stock > 0; false не фильтрует. Сортировка стабильна:
        при равном основном значении используется id. Устаревшую проекцию можно
        просматривать, но при stale=true создание заказа заблокировано.
        Сервер исключает товары с isActive=false, товары скрытых категорий и
        приватные медиа; фильтр или прямая карточка не обходят эту проверку. Поиск также
        учитывает websiteTitle. Показываемый заголовок — websiteTitle либо name.
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 120 }
        - name: category
          in: query
          schema: { $ref: '#/components/schemas/Category' }
        - name: brand
          in: query
          schema: { type: string, maxLength: 80 }
        - name: inStock
          in: query
          schema: { type: boolean, default: false }
        - name: sort
          in: query
          schema:
            type: string
            enum: [relevance, price_asc, price_desc]
            default: relevance
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Проекция каталога; пустой результат также имеет статус 200
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogPage' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /catalog/{productId}:
    get:
      tags: [Catalog]
      operationId: getProduct
      summary: Публичная карточка товара
      description: Фильтрация видимости и медиа выполняется сервером, как в /catalog
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Товар и давность проекции
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [product, catalogUpdatedAt, stale]
                properties:
                  product: { $ref: '#/components/schemas/Product' }
                  catalogUpdatedAt: { type: string, format: date-time }
                  stale: { type: boolean }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /orders:
    post:
      tags: [Orders]
      operationId: createOrder
      summary: Сохранить заявку и событие outbox в одной транзакции
      description: >-
        Сервер берёт цены из своей проекции и сравнивает их с expectedUnitPriceKopecks,
        затем повторно проверяет доступность при экспорте в 1С. Клиентские цены
        используются для проверки согласия, но никогда для расчёта суммы.
        Заказ принимает товар только при isActive=true AND category.isVisible=true,
        даже если клиент ранее сохранил id неактивного/скрытого товара.
        Публичного списка или поиска заказов нет. Действующий ключ с тем же
        нормализованным телом возвращает исходную квитанцию, с другим — 409.
        Параллельная ещё не завершённая операция возвращает 409
        IDEMPOTENCY_IN_PROGRESS и Retry-After. Ответ не обещает резерв в 1С.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '201':
          description: >-
            Заявка сохранена: new/pending_sync. Квитанция не содержит контактов.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderReceipt' }
        '200':
          description: Повтор исходной квитанции без создания второго заказа
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /feedback:
    post:
      tags: [Feedback]
      operationId: createFeedback
      summary: Принять контакты или запрос без регистрации
      description: >-
        Проверяется разрешённый Origin; сессия и CSRF-токен не нужны, cookie не
        дают привилегий. После нормализации требуется хотя бы один контакт;
        каждый заполненный контакт проверяется независимо. Обращение и одно
        событие feedback_telegram сохраняются одной транзакцией. Ответ 202
        выдаётся после commit и не обещает доставку уведомления или срок ответа.
        Повтор UUID с тем же нормализованным телом всегда возвращает исходную
        неизменяемую квитанцию 202, даже после закрытия или конверсии. Контакты,
        приватный статус, ответственный и заказ в публичный ответ не входят;
        публичного чтения обращений нет. Другое тело с тем же ключом — 409
        IDEMPOTENCY_CONFLICT; незавершённая параллельная попытка — 409
        IDEMPOTENCY_IN_PROGRESS и Retry-After. Ключ хранится с обращением и
        независим от ключей оформления и конверсии.
        Новые обращения ограничены PostgreSQL-счётчиком: 10 с IP и 3 на каждый
        указанный контакт за 10 минут; сохранённый повтор лимит не расходует.
        X-Real-IP учитывается только от TRUSTED_PROXY_HOSTS; произвольный
        X-Forwarded-For не используется. Ключи контактов в счётчике — HMAC.
        Без Telegram и 1С приём работает, уведомление ждёт настройки.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFeedbackRequest' }
      responses:
        '202':
          description: Сохранённая неизменяемая квитанция, включая успешный повтор
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedbackReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /manager/session:
    post:
      tags: [ManagerSession]
      operationId: loginManager
      summary: Создать серверную сессию сотрудника
      description: >-
        Вход проверяет Origin и ограничивает частоту попыток. Ошибка не раскрывает,
        существует ли логин. Пароль и тело запроса не логируются. Cookie:
        HttpOnly; Secure; SameSite=Strict; Path=/api. Один cookie обслуживает
        /manager и /admin; выход удаляет его с тем же Path. Ответы no-store.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [login, password]
              properties:
                login: { type: string, minLength: 1, maxLength: 120 }
                password: { type: string, minLength: 1, maxLength: 256, writeOnly: true }
      responses:
        '200':
          description: Сессия создана, csrfToken передаётся в закрытых изменяющих запросах
          headers:
            Set-Cookie: { schema: { type: string } }
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagerSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      tags: [ManagerSession]
      operationId: getManagerSession
      summary: Текущая сессия и роль сотрудника
      security: [{ ManagerCookie: [] }]
      x-required-roles: [manager, admin]
      responses:
        '200':
          description: Действующая сессия, no-store
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagerSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [ManagerSession]
      operationId: logoutManager
      summary: Отозвать серверную сессию и удалить cookie
      security: [{ ManagerCookie: [] }]
      x-required-roles: [manager, admin]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Сессия отозвана
          headers:
            Set-Cookie: { schema: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /manager/orders:
    get:
      tags: [ManagerOrders]
      operationId: listManagerOrders
      summary: Закрытый список заказов с контактными данными
      description: >-
        Роли manager/admin. Сортировка createdAt DESC, id DESC. Ответы no-store;
        контакты из ответа и текст поиска не попадают в журналы запросов.
      security: [{ ManagerCookie: [] }]
      x-required-roles: [manager, admin]
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/OrderStatus' }
        - name: integrationStatus
          in: query
          schema: { $ref: '#/components/schemas/IntegrationStatus' }
        - name: q
          in: query
          description: Номер заказа, имя или телефон; фильтр только закрытого API
          schema: { type: string, maxLength: 120 }
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Заказы, доступные сотруднику
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                required: [items, total, offset, limit]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ManagerOrder' }
                  total: { type: integer, minimum: 0 }
                  offset: { type: integer, minimum: 0 }
                  limit: { type: integer, minimum: 1, maximum: 100 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /manager/orders/{orderId}:
    get:
      tags: [ManagerOrders]
      operationId: getManagerOrder
      summary: Заказ для manager/admin
      security: [{ ManagerCookie: [] }]
      x-required-roles: [manager, admin]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Заказ со снимком цены и текущей версией
          headers:
            ETag: { $ref: '#/components/headers/OrderETag' }
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagerOrder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /manager/orders/{orderId}/status:
    patch:
      tags: [ManagerOrders]
      operationId: changeOrderStatus
      summary: Изменить бизнес-статус с проверкой текущей версии
      description: >-
        Роли manager/admin. Допустимы confirmed -> ready и ready -> completed.
        new -> cancelled допустим только при canCancel=true: отправка ещё не
        началась или однозначно отвергнута 1С. Экспортированную заявку отменяют
        в 1С; результат импортируется в CRM. completed — терминальный статус.
        confirmed устанавливается только по подтверждённому ответу 1С.
        Строки заказа и цены этим endpoint не редактируются.
      security: [{ ManagerCookie: [] }]
      x-required-roles: [manager, admin]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/CsrfToken'
        - name: If-Match
          in: header
          required: true
          description: ETag из GET заказа; отсутствующий или неверный формат — 400
          schema:
            type: string
            pattern: '^"[1-9][0-9]*"$'
            examples: ['"3"']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, enum: [ready, completed, cancelled] }
      responses:
        '200':
          description: Статус изменён, версия увеличена, запись аудита сохранена
          headers:
            ETag: { $ref: '#/components/headers/OrderETag' }
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagerOrder' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412':
          description: VERSION_CONFLICT — заказ изменился, нужно перечитать его
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /manager/feedback:
    get:
      tags: [ManagerFeedback]
      operationId: listManagerFeedback
      summary: Закрытый список обращений с контактами
      description: >-
        Любой действующий manager/admin читает все обращения. Фильтры объединяются
        AND; без status возвращаются все статусы, включая терминальные. Поиск без
        учёта регистра по номеру, имени, телефону, email и сервису/адресу мессенджера;
        пробелы по краям q обрезаются, %, _ и обратная косая черта ищутся буквально.
        Сортировка createdAt DESC, id DESC. Чтение не назначает ответственного и
        не меняет статус. Контакты и текст поиска не попадают в журналы.
      security: [{ ManagerCookie: [] }]
      x-required-roles: [manager, admin]
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/FeedbackStatus' }
        - name: q
          in: query
          schema: { type: string, maxLength: 120, default: '', pattern: '^[^\x00-\x1f\x7f]*$' }
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Страница полных карточек, no-store
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedbackPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /manager/feedback/{feedbackId}:
    get:
      tags: [ManagerFeedback]
      operationId: getManagerFeedback
      summary: Карточка обращения, история и состояние уведомления
      description: >-
        Читается напрямую по ID независимо от страницы списка. Требует сессию
        manager/admin, но не владение обращением. Открытие не меняет данные.
      security: [{ ManagerCookie: [] }]
      x-required-roles: [manager, admin]
      parameters:
        - $ref: '#/components/parameters/FeedbackId'
      responses:
        '200':
          description: Карточка с текущей версией и безопасным состоянием Telegram
          headers:
            ETag: { $ref: '#/components/headers/ResourceETag' }
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagerFeedback' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /manager/feedback/{feedbackId}/status:
    patch:
      tags: [ManagerFeedback]
      operationId: changeFeedbackStatus
      summary: Взять обращение в работу или закрыть с результатом
      description: >-
        Проверяются сессия manager/admin, Origin, CSRF, блокировка строки и If-Match.
        new -> in_progress назначает текущего сотрудника ответственным; new ->
        closed и in_progress -> closed требуют непустой resolution. Назначенное
        обращение меняет только ответственный либо admin. Два одновременных
        взятия не создают двух владельцев: устаревшая версия — 412. converted и
        closed терминальны; повторный переход и установка converted вручную
        недопустимы. Изменение, увеличение версии и аудит — одна транзакция.
        Отсутствующий/некорректный If-Match — 400, чужой владелец — 403,
        запрещённый переход — 409. Переназначения и повторного открытия нет.
      security: [{ ManagerCookie: [] }]
      x-required-roles: [manager, admin]
      parameters:
        - $ref: '#/components/parameters/FeedbackId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeFeedbackStatusRequest' }
      responses:
        '200':
          description: Полная карточка с увеличенной версией и сохранённым аудитом
          headers:
            ETag: { $ref: '#/components/headers/ResourceETag' }
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagerFeedback' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /manager/feedback/{feedbackId}/notes:
    post:
      tags: [ManagerFeedback]
      operationId: addFeedbackNote
      summary: Сохранить заметку и необязательный способ связи
      description: >-
        Только для in_progress, ответственным либо admin. Проверяются сессия,
        Origin, CSRF и If-Match под блокировкой строки. Заметка с автором и
        временем, увеличение версии и updatedAt сохраняются одной транзакцией.
        contactMethod фиксирует использованный канал, но не отправляет сообщение.
        Чужой владелец — 403, другой статус — 409, старая версия — 412,
        отсутствующий/неверный If-Match — 400. Ключа идемпотентности нет;
        повтор после успеха со старой версией не добавляет вторую заметку.
      security: [{ ManagerCookie: [] }]
      x-required-roles: [manager, admin]
      parameters:
        - $ref: '#/components/parameters/FeedbackId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddFeedbackNoteRequest' }
      responses:
        '200':
          description: Полная карточка с новой заметкой и увеличенной версией
          headers:
            ETag: { $ref: '#/components/headers/ResourceETag' }
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagerFeedback' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /manager/feedback/{feedbackId}/order:
    post:
      tags: [ManagerFeedback]
      operationId: createFeedbackOrder
      summary: Создать обычный заказ и атомарно связать его с обращением
      description: >-
        Сессия manager/admin, разрешённый Origin и CSRF обязательны. Менять
        назначенное обращение может ответственный либо admin. Новая конверсия
        требует in_progress и текущий If-Match. Используется общая логика
        CreateOrderRequest: нужны имя, российский телефон, товары, актуальные
        цены/остатки и адрес доставки при необходимости. В одной транзакции
        проверяются товары и цены, резервируются остатки, создаются Order и
        order_export, связь, статус converted, увеличенная версия и аудит.
        Любая ошибка откатывает всё; без адаптера 1С — 503 ERP_NOT_CONFIGURED,
        обращение остаётся в работе. converted означает локальное создание
        заказа и задания обмена, а не подтверждённую выгрузку или продажу.
        Отдельный UUID Idempotency-Key действует в рамках этого обращения и
        хранится вместе с нормализованным отпечатком и исходной карточкой ответа.
        После проверки сессии, CSRF и владельца успешный повтор возвращает
        исходные карточку и ETag с 200 до проверки If-Match, статуса и ERP;
        устаревший If-Match не мешает этому повтору. Другое тело с тем же ключом —
        409 IDEMPOTENCY_CONFLICT. Другой ключ после успеха — 409
        FEEDBACK_ALREADY_CONVERTED с details[].orderId. Параллельная одинаковая
        попытка — 409 IDEMPOTENCY_IN_PROGRESS и Retry-After. Второй заказ из
        одного обращения не создаётся. Ключ независим от публичного приёма и
        покупательского оформления; исходная форма обращения не изменяется.
      security: [{ ManagerCookie: [] }]
      x-required-roles: [manager, admin]
      parameters:
        - $ref: '#/components/parameters/FeedbackId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '201':
          description: Заказ, резерв, событие обмена и связь сохранены; полная карточка обращения
          headers:
            ETag: { $ref: '#/components/headers/ResourceETag' }
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagerFeedback' }
        '200':
          description: Исходная карточка и ETag успешной конверсии без второго заказа
          headers:
            ETag: { $ref: '#/components/headers/ResourceETag' }
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagerFeedback' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /manager/integration/health:
    get:
      tags: [Integration]
      operationId: getIntegrationHealth
      summary: Состояние обмена, только admin
      description: Проверяется роль admin; не возвращает URL, пароли, токены и необработанный ответ 1С
      security: [{ ManagerCookie: [] }]
      x-required-roles: [admin]
      responses:
        '200':
          description: Состояние обмена; недоступность 1С отражается в теле ответа
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncHealth' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /manager/integration/sync:
    post:
      tags: [Integration]
      operationId: enqueueCatalogSync
      summary: Поставить импорт в очередь, только admin
      description: >-
        Проверяются роль, Origin и CSRF. Повтор с прежним Idempotency-Key
        возвращает тот же jobId. Уже запущенный цикл не запускает параллельный
        импорт; ответ указывает существующую задачу.
      security: [{ ManagerCookie: [] }]
      x-required-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Задача принята; 202 не означает успешный обмен с 1С
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /manager/integration/orders/{orderId}/retry:
    post:
      tags: [Integration]
      operationId: retryOrderExport
      summary: Поставить ошибочный экспорт на повтор, только admin
      description: >-
        Не создаёт новое событие/внешнюю ссылку заказа. Если результат предыдущей
        отправки неизвестен, worker сначала выполняет сверку с 1С по Order.id.
        Повтор того же ключа возвращает прежнюю задачу. exported, cancelled и
        completed не допускают повторного создания документа; конфликт — 409.
      security: [{ ManagerCookie: [] }]
      x-required-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Повтор/сверка поставлены в очередь
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /site:
    get:
      tags: [Site]
      operationId: getPublicSite
      summary: Опубликованные настройки и материалы фиксированного шаблона
      description: >-
        Вход не требуется. Backend возвращает только status=published с
        startsAt=null или startsAt <= now и endsAt=null или now < endsAt.
        Время — серверное UTC; граница endsAt исключается. Публикации сортируются
        position ASC, id ASC; draft/archived/вне окна отсутствуют в ответе.
        Публикации со скрытой/недоступной целью также исключаются.
        Меню исключает isVisible=false и ссылки на скрытые/недоступные объекты.
        Для целей товара обязательны isActive=true AND category.isVisible=true.
        Если цель hero недоступна, hero.target=null и кнопка не показывается;
        заголовок, описание и фон остаются видимыми.
        Медиа возвращаются только для видимых объектов. Нет контактов покупателей,
        сессий, внутренних версий или секретов 1С. HTML и произвольные URL не поддерживаются.
      responses:
        '200':
          description: Текущая публичная проекция сайта
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicSite' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /categories:
    get:
      tags: [Catalog]
      operationId: listPublicCategories
      summary: Видимые категории витрины без входа
      description: >-
        Сервер оставляет только isVisible=true и сортирует position ASC, id ASC.
        showInMenu определяет присутствие в меню каталога, а не доступность
        категории через поиск. В /site/menu находятся отдельные настроенные ссылки;
        они не заменяют навигацию из categories.showInMenu. Повтор ссылки на
        категорию в двух этих местах допустим как намеренная настройка.
      responses:
        '200':
          description: Категории для фильтров и меню каталога
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PublicCategory' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
